name: Sync WEB DOCTOR PRO Telegram Profile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-profile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Trigger production health and profile sync
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --connect-timeout 10 "https://webdoctorpro.nadeemmhdm-ai.workers.dev/health"
      - name: Remove one-time workflow
        run: |
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git rm .github/workflows/sync-profile.yml
          git commit -m "chore: remove one-time profile sync workflow"
          git push
