name: Prepare WEB DOCTOR PRO v1.3.1 Deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-v131-deploy.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test and build one-file Worker
        run: |
          set -euo pipefail
          npm test
          npm run check
          node - <<'NODE'
          const fs=require('fs');
          let lib=fs.readFileSync('src/lib.js','utf8').replace(/^export\s+/gm,'');
          let index=fs.readFileSync('src/index.js','utf8');
          index=index.replace(/^import\s*\{[\s\S]*?\}\s*from\s*['"]\.\/lib\.js['"];\s*/,'');
          index=index.replace(/^export\s*\{[^\n]+\};\s*/m,'');
          fs.writeFileSync('/tmp/worker.js',lib+'\n'+index);
          NODE
          node --check /tmp/worker.js
          grep -q "const VERSION = '1.3.1'" /tmp/worker.js
          grep -q "createInvoiceLink" /tmp/worker.js
          grep -q "ADMIN_TELEGRAM_ID = '8984229401'" /tmp/worker.js
          grep -q "user_gifts" /tmp/worker.js
          grep -q "adminSetExactPlan" /tmp/worker.js
          rm -rf .deploy_v131
          mkdir .deploy_v131
          gzip -9 -c /tmp/worker.js | base64 -w0 > /tmp/worker.b64
          fold -w 2500 /tmp/worker.b64 | split -d -a 2 -l 1 - .deploy_v131/p_
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),zlib=require('zlib');
          const b64=fs.readFileSync('/tmp/worker.b64','utf8').trim();
          const gz=Buffer.from(b64,'base64');
          const src=zlib.gunzipSync(gz).toString('utf8');
          const chunks=fs.readdirSync('.deploy_v131').filter(x=>x.startsWith('p_')).sort();
          fs.writeFileSync('.deploy_v131/manifest.json',JSON.stringify({version:'1.3.1',sourceCommit:process.env.GITHUB_SHA,bundleChars:src.length,gzipBytes:gz.length,base64Chars:b64.length,base64Sha256:crypto.createHash('sha256').update(b64).digest('hex'),workerSha256:crypto.createHash('sha256').update(src).digest('hex'),chunks:chunks.length},null,2));
          NODE
          rm -f .github/workflows/prepare-v131-deploy.yml
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare verified v1.3.1 deployment payload"
          git push
