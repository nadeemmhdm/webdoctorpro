name: Cleanup v1.4.1 Deployment Artifacts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-v141-artifacts.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary deployment payloads
        run: |
          rm -rf .deploy_v140 .deploy_v141 .deploy_delta_v141
          rm -f .github/workflows/cleanup-v141-artifacts.yml
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add -A
          git commit -m "chore: clean v1.4.1 deployment artifacts"
          git push
