name: Fix transient homepage metadata v1.8.2
on:
  push:
    paths:
      - '.github/workflows/fix-transient-homepage-metadata-v182.yml'
      - 'scripts/fix_transient_homepage_metadata_v182.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply homepage metadata stabilization patch
        run: python3 scripts/fix_transient_homepage_metadata_v182.py
      - name: Validate
        run: |
          node --check src/index.js
          node --check src/lib.js
          node --check src/miniapp.js
          npm test
      - name: Commit
        shell: bash
        run: |
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add src/index.js package.json test/platform.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: suppress transient blank homepage metadata alerts"
          git push
