name: Add Subdomain Doctor v1.8.0
on:
  push:
    paths:
      - '.github/workflows/add-subdomain-doctor-v180.yml'
      - 'scripts/add_subdomain_doctor_v180.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Normalize temporary patch anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/add_subdomain_doctor_v180.py')
          t = p.read_text()
          a = t.index('# Team help.')
          b = t.index('# Team command routing before generic tool map.')
          team = '''# Team help.\nbsnl = chr(92) + chr(10)\nif "/mail domain" not in s:\n    raise SystemExit('Team help anchor missing')\ns = s.replace("/mail domain", "/mail domain" + bsnl + "/subdomains domain [page]", 1)\n\n'''
          t = t[:a] + team + t[b:]
          a = t.index('# Private help.')
          b = t.index('# Private command routing before existing website tool list.')
          private = '''# Private help.\nif "/keywords example.com — keyword opportunities" not in s:\n    raise SystemExit('Private help anchor missing')\ns = s.replace("/keywords example.com — keyword opportunities", "/keywords example.com — keyword opportunities" + bsnl + "/mail example.com — mail DNS health" + bsnl + "/subdomains example.com — verified subdomain health + SEO", 1)\n\n'''
          t = t[:a] + private + t[b:]
          p.write_text(t)
          PY
      - name: Apply Subdomain Doctor patch
        run: python3 scripts/add_subdomain_doctor_v180.py
      - name: Refresh regression assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/platform.test.js')
          t = p.read_text()
          t = t.replace("'/robots','/keywords','/mail','/main','/add'", "'/robots','/keywords','/mail','/main','/subdomains','/add'")
          t = t.replace("assert.ok(mini.includes('data-sitecmd=\\\\\"/subdomains\\\\\"'));", "assert.ok(mini.includes('>Subdomains</button>'));", 1)
          p.write_text(t)
          PY
      - name: Validate
        run: |
          node --check src/index.js
          node --check src/lib.js
          node --check src/miniapp.js
          npm test
      - name: Commit
        shell: bash
        run: |
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add src/index.js src/miniapp.js package.json test/platform.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add verified Subdomain Doctor health and SEO scans"
          git push
