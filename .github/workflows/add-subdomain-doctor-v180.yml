name: Add Subdomain Doctor v1.8.0
on:
  push:
    paths:
      - '.github/workflows/add-subdomain-doctor-v180.yml'
      - 'scripts/add_subdomain_doctor_v180.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Subdomain Doctor patch
        run: python3 scripts/add_subdomain_doctor_v180.py
      - name: Validate
        run: |
          node --check src/index.js
          node --check src/lib.js
          node --check src/miniapp.js
          npm test
      - name: Commit
        shell: bash
        run: |
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add src/index.js src/miniapp.js package.json test/platform.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add verified Subdomain Doctor health and SEO scans"
          git push
