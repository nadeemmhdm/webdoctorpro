name: Stage WEB DOCTOR PRO v1.6 Through Bridge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage-v160-through-bridge.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage exact tested source into D1
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "https://webdoctorpro-deploy-bridge-v160.nadeemmhdm-ai.workers.dev/stage-7e91d47a" \
            | tee /tmp/stage.json
          grep -q '"ok":true' /tmp/stage.json
      - name: Remove bridge trigger workflow
        run: |
          rm -f .github/workflows/stage-v160-through-bridge.yml
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove v1.6 bridge trigger"
          git push
