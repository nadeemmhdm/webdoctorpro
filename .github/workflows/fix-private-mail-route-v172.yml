name: Fix private mail route v1.7.2
on:
  push:
    paths:
      - '.github/workflows/fix-private-mail-route-v172.yml'
      - 'scripts/fix_private_mail_route_v172.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply private Mail Health route patch
        run: python3 scripts/fix_private_mail_route_v172.py
      - name: Validate
        run: |
          node --check src/index.js
          node --check src/lib.js
          node --check src/miniapp.js
          npm test
      - name: Commit
        shell: bash
        run: |
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add src/index.js package.json test/platform.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: route private mail commands to Mail Health"
          git push
