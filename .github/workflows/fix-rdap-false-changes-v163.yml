name: Fix RDAP false changes v1.6.3
on:
  push:
    paths:
      - '.github/workflows/fix-rdap-false-changes-v163.yml'
      - 'scripts/fix_rdap_false_changes_v163.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply patch
        run: python3 scripts/fix_rdap_false_changes_v163.py
      - name: Test
        run: |
          node --check src/index.js
          node --check src/lib.js
          node --check src/miniapp.js
          npm test
      - name: Commit
        shell: bash
        run: |
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add src/index.js package.json test/platform.test.js
          git commit -m "fix: suppress transient RDAP change alerts and rename Mini App button"
          git push
