name: Cleanup WEB DOCTOR PRO v1.3.1 Deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-v131.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary deploy payload
        run: |
          set -euo pipefail
          rm -rf .deploy_v131
          rm -f .github/workflows/cleanup-v131.yml
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add -A
          git commit -m "chore: clean v1.3.1 deployment payload"
          git push
