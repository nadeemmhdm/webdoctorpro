name: WEB DOCTOR PRO v1.3.0 Upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upgrade-v130.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify, apply and test v1.3.0 snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .upgrade/v130_p*.b64 | tr -d '\n\r ' | base64 -d > /tmp/webdoctorpro-v130.tgz
          echo "72b3cd208664af20a7865b13eb067c308116065e9f4dab41fac13b9785e275a9  /tmp/webdoctorpro-v130.tgz" | sha256sum -c -
          tar -xzf /tmp/webdoctorpro-v130.tgz -C .
          npm test
          npm run check
          test "$(node -p "require('./package.json').version")" = "1.3.0"
          rm -rf .upgrade
          rm -f .github/workflows/upgrade-v130.yml
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add -A
          git commit -m "feat: upgrade WEB DOCTOR PRO to v1.3.0"
          git push
