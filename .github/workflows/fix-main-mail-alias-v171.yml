name: Fix main mail alias v1.7.1
on:
  push:
    paths:
      - '.github/workflows/fix-main-mail-alias-v171.yml'
      - 'scripts/fix_main_mail_alias_v171.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply alias patch
        run: python3 scripts/fix_main_mail_alias_v171.py
      - name: Validate
        run: |
          node --check src/index.js
          node --check src/lib.js
          node --check src/miniapp.js
          npm test
      - name: Commit
        shell: bash
        run: |
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add src/index.js package.json test/platform.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: accept /main as alias for /mail"
          git push
