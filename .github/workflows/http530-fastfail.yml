name: HTTP 530 Fast Fail

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/http530-fastfail.yml
      - .github/scripts/http530-fastfail.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: node .github/scripts/http530-fastfail.mjs
      - name: Verify
        run: |
          set -euo pipefail
          npm test
          npm run check
          node --check src/index.js
          grep -q "const VERSION = '1.4.1'" src/index.js
          grep -q "return r.status === 530" src/index.js
          grep -q "Invalid domain" src/index.js
      - name: Commit
        run: |
          rm -f .github/workflows/http530-fastfail.yml .github/scripts/http530-fastfail.mjs
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add -A
          git commit -m "fix: stop domain checks immediately on HTTP 530"
          git push
