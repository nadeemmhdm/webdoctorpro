name: Add Mail Health Monitor v1.7.0
on:
  push:
    paths:
      - '.github/workflows/add-mail-health-v170.yml'
      - 'scripts/add_mail_health_v170.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Mail Health patch
        run: python3 scripts/add_mail_health_v170.py
      - name: Update HTTP 530 regression assertion for DNS-only mail checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/platform.test.js')
          s=p.read_text()
          old="assert.ok(source.includes('if (await isHttp530Domain(domain)) return send(env, chatId, invalidDomain530Text(domain));'))"
          new="assert.ok(source.includes(\"if (action !== 'mail' && await isHttp530Domain(domain)) return send(env, chatId, invalidDomain530Text(domain));\"))"
          if old not in s:
              raise SystemExit('HTTP 530 assertion marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate
        run: |
          node --check src/index.js
          node --check src/lib.js
          node --check src/miniapp.js
          npm test
      - name: Commit
        shell: bash
        run: |
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add src/index.js src/miniapp.js package.json test/platform.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add Mail Health Monitor to bot and Mini App"
          git push
