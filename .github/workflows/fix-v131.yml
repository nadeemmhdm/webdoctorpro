name: WEB DOCTOR PRO v1.3.1 Fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-v131.yml
      - .github/scripts/fix-v131.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded patch
        run: node .github/scripts/fix-v131.mjs
      - name: Test
        run: |
          npm test
          npm run check
          test "$(node -p "require('./package.json').version")" = "1.3.1"
      - name: Commit production source
        run: |
          rm -f .github/workflows/fix-v131.yml .github/scripts/fix-v131.mjs
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add -A
          git commit -m "fix: WEB DOCTOR PRO v1.3.1 payments admin gifts and DNS verification"
          git push
