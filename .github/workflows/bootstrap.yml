name: WEB DOCTOR PRO Bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Activate Telegram webhook
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 --connect-timeout 10 \
            "https://webdoctorpro.nadeemmhdm-ai.workers.dev/bootstrap"
