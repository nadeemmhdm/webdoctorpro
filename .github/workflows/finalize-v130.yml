name: Finalize WEB DOCTOR PRO v1.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-v130.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Sync Telegram profile and clean deploy payloads
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 --connect-timeout 10 \
            "https://webdoctorpro.nadeemmhdm-ai.workers.dev/health" >/tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          rm -rf .deploy .deploy_transport
          rm -f .github/workflows/finalize-v130.yml
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize WEB DOCTOR PRO v1.3.0 production"
          git push
