name: Prepare WEB DOCTOR PRO v1.5.0 Delta

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-v150-delta.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delta:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact v1.4.1 and v1.5.0 Worker bundles
        run: |
          set -euo pipefail
          OLD=f4613748b166c5e5d4020fd94586e4c7932caa7e
          mkdir -p /tmp/oldsrc
          git show "$OLD:src/lib.js" > /tmp/oldsrc/lib.js
          git show "$OLD:src/index.js" > /tmp/oldsrc/index.js
          node - <<'NODE'
          const fs=require('fs');
          function bundle(libPath,indexPath,out){
            let lib=fs.readFileSync(libPath,'utf8').replace(/^export\s+/gm,'');
            let index=fs.readFileSync(indexPath,'utf8');
            index=index.replace(/^import\s*\{[\s\S]*?\}\s*from\s*['"]\.\/lib\.js['"];\s*/,'');
            index=index.replace(/^export\s*\{[^\n]+\};\s*/m,'');
            fs.writeFileSync(out,lib+'\n'+index);
          }
          bundle('/tmp/oldsrc/lib.js','/tmp/oldsrc/index.js','/tmp/old-worker.js');
          bundle('src/lib.js','src/index.js','/tmp/new-worker.js');
          NODE
          node --check /tmp/old-worker.js
          node --check /tmp/new-worker.js
          OLD_HASH=$(sha256sum /tmp/old-worker.js | awk '{print $1}')
          test "$OLD_HASH" = "96f9e840cd4eaa31c9a17997a5e99ffdb2aba2eb6717c180c89cd771abb1b187"
          python - <<'PY'
          import difflib, gzip, base64, json, hashlib
          from pathlib import Path
          old=Path('/tmp/old-worker.js').read_text()
          new=Path('/tmp/new-worker.js').read_text()
          old_lines=old.splitlines(keepends=True)
          new_lines=new.splitlines(keepends=True)
          sm=difflib.SequenceMatcher(None,old_lines,new_lines,autojunk=False)
          ops=[]
          for tag,a,b,c,d in sm.get_opcodes():
              if tag!='equal': ops.append([a,b,''.join(new_lines[c:d])])
          payload={'old_len':len(old),'new_len':len(new),'old_sha256':hashlib.sha256(old.encode()).hexdigest(),'new_sha256':hashlib.sha256(new.encode()).hexdigest(),'old_lines':len(old_lines),'ops':ops}
          raw=json.dumps(payload,separators=(',',':'),ensure_ascii=False).encode()
          gz=gzip.compress(raw,compresslevel=9)
          b64=base64.b64encode(gz).decode()
          out=Path('.deploy_delta_v150'); out.mkdir(exist_ok=True)
          (out/'patch.b64').write_text(b64)
          (out/'manifest.json').write_text(json.dumps({'version':'1.5.0','old_len':len(old),'new_len':len(new),'old_sha256':payload['old_sha256'],'new_sha256':payload['new_sha256'],'old_lines':len(old_lines),'ops':len(ops),'patch_json_bytes':len(raw),'patch_gzip_bytes':len(gz),'patch_b64_chars':len(b64)},indent=2))
          print((out/'manifest.json').read_text())
          PY
          rm -f .github/workflows/prepare-v150-delta.yml
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare verified v1.5.0 deployment delta"
          git push
