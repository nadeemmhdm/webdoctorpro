name: Diagnose Mini App Inline Script
on:
  push:
    paths:
      - '.github/workflows/diagnose-miniapp-inline.yml'
      - 'src/miniapp.js'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract and syntax-check browser script
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { MINI_APP_HTML } from './src/miniapp.js';
          const matches = [...MINI_APP_HTML.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          console.log('scriptBlocks=', matches.length);
          matches.forEach((m,i)=>console.log('block', i, 'chars', m[1].length));
          const inline = matches.map(m=>m[1]).filter(Boolean).sort((a,b)=>b.length-a.length)[0] || '';
          await (await import('node:fs/promises')).writeFile('/tmp/mini-inline.js', inline);
          console.log('inlineChars=', inline.length);
          console.log('containsLoad=', inline.includes('async function load()'));
          console.log('tail=', JSON.stringify(inline.slice(-300)));
          NODE
          node --check /tmp/mini-inline.js
      - name: Detect startup hazards
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { MINI_APP_HTML } from './src/miniapp.js';
          const inline=[...MINI_APP_HTML.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean).sort((a,b)=>b.length-a.length)[0]||'';
          const checks={
            hasLoadCall:/\brenderTools\(\);\s*load\(\)/.test(inline),
            hasInitDataGuard:inline.includes("if(!initData())throw new Error"),
            hasApiFetch:inline.includes("fetch(path"),
            hasCatchUi:inline.includes("Could not open WEB DOCTOR PRO"),
            hasTelegramReady:inline.includes('tg.ready()'),
            hasUnhandledDollarCalls:/\$\('[^']+'\)\.addEventListener/.test(inline)
          };
          console.log(JSON.stringify(checks,null,2));
          const ids=[...MINI_APP_HTML.matchAll(/id="([^"]+)"/g)].map(m=>m[1]);
          const refs=[...inline.matchAll(/\$\('([^']+)'\)/g)].map(m=>m[1]);
          const missing=[...new Set(refs.filter(x=>!ids.includes(x)))];
          console.log('missingIds=',JSON.stringify(missing));
          if(missing.length) process.exitCode=2;
          NODE
