name: WEB DOCTOR PRO v1.1.0 Upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upgrade-v110.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.1.0 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/webdoctorpro-upgrade.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 -d /tmp/webdoctorpro-upgrade.b64 > /tmp/webdoctorpro-upgrade.tar.gz
          tar -xzf /tmp/webdoctorpro-upgrade.tar.gz -C .
          rm -f .github/workflows/upgrade-v110.yml
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add -A
          git commit -m "feat: upgrade WEB DOCTOR PRO to v1.1.0"
          git push
