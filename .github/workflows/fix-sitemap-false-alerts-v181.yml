name: Fix sitemap false alerts v1.8.1
on:
  push:
    paths:
      - '.github/workflows/fix-sitemap-false-alerts-v181.yml'
      - 'scripts/fix_sitemap_false_alerts_v181.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply sitemap monitor fix
        run: python3 scripts/fix_sitemap_false_alerts_v181.py
      - name: Validate
        run: |
          node --check src/index.js
          node --check src/lib.js
          node --check src/miniapp.js
          npm test
      - name: Commit
        shell: bash
        run: |
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add src/index.js src/lib.js package.json test/platform.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: suppress false sitemap change alerts"
          git push
