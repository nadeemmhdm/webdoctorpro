name: Prepare WEB DOCTOR PRO v1.4.1 Delta

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-v141-delta.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact old and new Worker bundles and compact line delta
        run: |
          set -euo pipefail
          OLD=74e4c872f6a962f73d587e70411c5c60bda3d609
          mkdir -p /tmp/oldsrc
          git show "$OLD:src/lib.js" > /tmp/oldsrc/lib.js
          git show "$OLD:src/index.js" > /tmp/oldsrc/index.js
          node - <<'NODE'
          const fs=require('fs');
          function bundle(libPath,indexPath,out){
            let lib=fs.readFileSync(libPath,'utf8').replace(/^export\s+/gm,'');
            let index=fs.readFileSync(indexPath,'utf8');
            index=index.replace(/^import\s*\{[\s\S]*?\}\s*from\s*['"]\.\/lib\.js['"];\s*/,'');
            index=index.replace(/^export\s*\{[^\n]+\};\s*/m,'');
            fs.writeFileSync(out,lib+'\n'+index);
          }
          bundle('/tmp/oldsrc/lib.js','/tmp/oldsrc/index.js','/tmp/old-worker.js');
          bundle('src/lib.js','src/index.js','/tmp/new-worker.js');
          NODE
          node --check /tmp/old-worker.js
          node --check /tmp/new-worker.js
          python - <<'PY'
          import difflib, gzip, base64, json, hashlib
          from pathlib import Path
          old=Path('/tmp/old-worker.js').read_text()
          new=Path('/tmp/new-worker.js').read_text()
          a=old.splitlines(keepends=True); b=new.splitlines(keepends=True)
          sm=difflib.SequenceMatcher(None,a,b,autojunk=False)
          ops=[]
          for tag,i1,i2,j1,j2 in sm.get_opcodes():
              if tag!='equal': ops.append([i1,i2,''.join(b[j1:j2])])
          payload={'old_len':len(old),'new_len':len(new),'old_sha256':hashlib.sha256(old.encode()).hexdigest(),'new_sha256':hashlib.sha256(new.encode()).hexdigest(),'old_lines':len(a),'ops':ops}
          raw=json.dumps(payload,separators=(',',':'),ensure_ascii=False).encode()
          gz=gzip.compress(raw,compresslevel=9)
          b64=base64.b64encode(gz).decode()
          Path('.deploy_delta_v141').mkdir(exist_ok=True)
          Path('.deploy_delta_v141/patch.b64').write_text(b64)
          Path('.deploy_delta_v141/manifest.json').write_text(json.dumps({'old_len':len(old),'new_len':len(new),'old_sha256':payload['old_sha256'],'new_sha256':payload['new_sha256'],'old_lines':len(a),'ops':len(ops),'patch_json_bytes':len(raw),'patch_gzip_bytes':len(gz),'patch_b64_chars':len(b64)},indent=2))
          print(Path('.deploy_delta_v141/manifest.json').read_text())
          PY
          rm -f .github/workflows/prepare-v141-delta.yml
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare compact v1.4.1 deployment delta"
          git push
