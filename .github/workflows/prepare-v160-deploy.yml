name: Prepare WEB DOCTOR PRO v1.6 Deploy Payload

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-v160-deploy.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source
        run: |
          npm test
          npm run check
          node --check src/miniapp.js
      - name: Build checksummed source archive
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,gzip,base64,hashlib,shutil
          root=Path('.deploy_v160')
          if root.exists(): shutil.rmtree(root)
          root.mkdir()
          files={name:Path('src',name).read_text() for name in ['index.js','lib.js','miniapp.js']}
          raw=json.dumps(files,separators=(',',':'),ensure_ascii=False).encode()
          gz=gzip.compress(raw,compresslevel=9)
          b64=base64.b64encode(gz).decode()
          chunk=6000
          parts=[b64[i:i+chunk] for i in range(0,len(b64),chunk)]
          for i,x in enumerate(parts): (root/f'chunk-{i:02d}.txt').write_text(x)
          manifest={
            'version':'1.6.0','commit':__import__('subprocess').check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'raw_sha256':hashlib.sha256(raw).hexdigest(),'gzip_sha256':hashlib.sha256(gz).hexdigest(),
            'raw_bytes':len(raw),'gzip_bytes':len(gz),'base64_chars':len(b64),'chunks':len(parts),
            'files':{k:{'chars':len(v),'sha256':hashlib.sha256(v.encode()).hexdigest()} for k,v in files.items()}
          }
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - name: Commit deployment payload
        run: |
          rm -f .github/workflows/prepare-v160-deploy.yml
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add -A
          git commit -m "chore: stage verified v1.6 production payload"
          git push
