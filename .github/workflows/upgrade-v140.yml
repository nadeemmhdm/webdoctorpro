name: Upgrade WEB DOCTOR PRO v1.4.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/upgrade-v140.yml
      - .github/scripts/upgrade-v140.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize patch generator literals
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('.github/scripts/upgrade-v140.mjs')
          t = p.read_text()
          for name in ('teamHelpers', 'adminAdsView'):
              marker = f'const {name} = `'
              start = t.index(marker) + len(marker)
              end = t.index('\n`;', start)
              segment = t[start:end]
              segment = re.sub(r'(?<!\\)`', r'\\`', segment)
              t = t[:start] + segment + t[end:]
          p.write_text(t)
          PY
      - name: Apply guarded upgrade
        run: node .github/scripts/upgrade-v140.mjs
      - name: Test and syntax check
        run: |
          set -euo pipefail
          npm test
          npm run check
          node --check src/index.js
          test "$(node -p "require('./package.json').version")" = "1.4.0"
          grep -q "activateTeamWorkspace" src/index.js
          grep -q "adminAdsView" src/index.js
          grep -q "team_activation_codes" migrations/0006_team_plan_and_button_ux.sql
      - name: Commit production upgrade
        run: |
          rm -f .github/workflows/upgrade-v140.yml .github/scripts/upgrade-v140.mjs
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Team plan activation and button-first admin UX"
          git push
