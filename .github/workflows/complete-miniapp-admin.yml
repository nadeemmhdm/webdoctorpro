name: Complete WEB DOCTOR PRO Mini App Admin

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/complete-miniapp-admin.yml
      - .github/scripts/complete-miniapp-admin.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply admin parity patch
        run: python .github/scripts/complete-miniapp-admin.py
      - name: Test and syntax check
        run: |
          npm test
          npm run check
          node --check src/miniapp.js
          grep -q "Create broadcast draft" src/miniapp.js
          grep -q "Create sponsored ad" src/miniapp.js
          grep -q "ad_create_text" src/index.js
      - name: Commit production source
        run: |
          rm -f .github/workflows/complete-miniapp-admin.yml .github/scripts/complete-miniapp-admin.py
          git config user.name "Nadeem"
          git config user.email "160517299+nadeemmhdm@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete Mini App admin campaign management"
          git push
